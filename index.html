<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Tracking Cơ Bản</title>
    <!-- Import các thư viện MediaPipe từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-top: 20px; }
        .container {
            position: relative;
            margin-top: 10px;
        }
        /* Ẩn video gốc, chỉ hiện canvas đã được AI vẽ lên */
        video { display: none; }
        canvas {
            border: 3px solid #444;
            border-radius: 10px;
            background-color: #000;
            max-width: 100%;
        }
        .dashboard {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            border: 1px solid #555;
        }
        .dashboard p { margin: 5px 0; font-size: 16px; }
        .val { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <h2>AI Nhận Diện Khuôn Mặt (Webcam)</h2>
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
        
        <!-- Bảng điều khiển hiển thị thông số -->
        <div class="dashboard">
            <p>⚡ FPS: <span id="fps" class="val">0</span></p>
            <p>👀 Chớp mắt: <span id="blinks" class="val">0</span></p>
            <p>👄 Miệng: <span id="mouth" class="val">Đóng</span></p>
            <p>👤 Hướng đầu: <span id="head" class="val">Chính diện</span></p>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        // Các thành phần UI
        const fpsEl = document.getElementById('fps');
        const blinksEl = document.getElementById('blinks');
        const mouthEl = document.getElementById('mouth');
        const headEl = document.getElementById('head');

        // Biến trạng thái
        let blinkCount = 0;
        let isBlinking = false;
        let lastTime = 0;

        // Hàm tính khoảng cách giữa 2 điểm (Pythagore)
        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // Hàm xử lý kết quả trả về từ AI mỗi khung hình
        function onResults(results) {
            // 1. Tính toán FPS
            const now = performance.now();
            const fps = Math.round(1000 / (now - lastTime));
            lastTime = now;
            fpsEl.innerText = fps;

            // Xóa canvas và vẽ hình ảnh từ webcam lên
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // 2. Vẽ tất cả các điểm trên mặt (mờ mờ làm nền)
                drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#ffffff30', lineWidth: 1});

                // 3. Tô màu các bộ phận nổi bật
                // Mắt (Đỏ)
                drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#FF0000', lineWidth: 2});
                drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#FF0000', lineWidth: 2});
                // Miệng (Xanh lá)
                drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#00FF00', lineWidth: 2});
                
                // Mũi (Xanh dương) - Tô đậm các điểm vùng mũi
                const nosePoints = [1, 2, 4, 195, 197];
                canvasCtx.fillStyle = '#0088FF';
                nosePoints.forEach(idx => {
                    const p = landmarks[idx];
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x * canvasElement.width, p.y * canvasElement.height, 4, 0, 2 * Math.PI);
                    canvasCtx.fill();
                });

                // 4. Hiển thị chữ (tên bộ phận)
                canvasCtx.fillStyle = "yellow";
                canvasCtx.font = "16px Arial";
                // Lấy tọa độ một số điểm chuẩn để đặt chữ
                canvasCtx.fillText("Mắt", landmarks[159].x * canvasElement.width - 15, landmarks[159].y * canvasElement.height - 15);
                canvasCtx.fillText("Mắt", landmarks[386].x * canvasElement.width - 15, landmarks[386].y * canvasElement.height - 15);
                canvasCtx.fillText("Mũi", landmarks[1].x * canvasElement.width - 10, landmarks[1].y * canvasElement.height - 15);
                canvasCtx.fillText("Miệng", landmarks[13].x * canvasElement.width - 20, landmarks[13].y * canvasElement.height - 20);

                // 5. Đếm số lần chớp mắt (Dựa vào Tỷ lệ Mắt - EAR)
                const leftEyeH = getDistance(landmarks[159], landmarks[145]);
                const leftEyeW = getDistance(landmarks[33], landmarks[133]);
                const rightEyeH = getDistance(landmarks[386], landmarks[374]);
                const rightEyeW = getDistance(landmarks[362], landmarks[263]);
                
                const avgEAR = ((leftEyeH / leftEyeW) + (rightEyeH / rightEyeW)) / 2;

                if (avgEAR < 0.22) { // Ngưỡng nhắm mắt
                    if (!isBlinking) {
                        blinkCount++;
                        blinksEl.innerText = blinkCount;
                        isBlinking = true;
                    }
                } else {
                    isBlinking = false;
                }

                // 6. Phát hiện mở miệng (Dựa vào Tỷ lệ Miệng)
                const mouthH = getDistance(landmarks[13], landmarks[14]); // Môi trên và môi dưới
                const mouthW = getDistance(landmarks[78], landmarks[308]); // Khóe miệng 2 bên
                const mar = mouthH / mouthW;

                if (mar > 0.15) { // Ngưỡng mở miệng
                    mouthEl.innerText = "Đang mở";
                    mouthEl.style.color = "red";
                } else {
                    mouthEl.innerText = "Đóng";
                    mouthEl.style.color = "#00ff00";
                }

                // 7. Theo dõi đầu (Dựa vào khoảng cách mũi tới 2 bên má)
                const nose = landmarks[1];
                const leftCheek = landmarks[234];
                const rightCheek = landmarks[454];

                const distLeft = getDistance(nose, leftCheek);
                const distRight = getDistance(nose, rightCheek);
                const headRatio = distLeft / distRight;

                if (headRatio > 1.6) {
                    headEl.innerText = "Quay phải ➔";
                } else if (headRatio < 0.6) {
                    headEl.innerText = "Quay trái 🡨";
                } else {
                    headEl.innerText = "Chính diện 👤";
                }
            }
            canvasCtx.restore();
        }

        // Khởi tạo AI Face Mesh
        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});
        
        faceMesh.setOptions({
            maxNumFaces: 1, // Theo dõi 1 khuôn mặt
            refineLandmarks: true, // Bật điểm mắt và môi chi tiết
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        faceMesh.onResults(onResults);

        // Kích hoạt Webcam
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();

    </script>
</body>
</html>
