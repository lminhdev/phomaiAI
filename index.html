<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Tracking Cải Thiện</title>
    <!-- Import các thư viện MediaPipe từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-top: 20px; }
        .container {
            position: relative;
            margin-top: 10px;
        }
        video { display: none; }
        canvas {
            border: 3px solid #444;
            border-radius: 10px;
            background-color: #000;
            max-width: 100%;
            /* Lật gương canvas để cử động tự nhiên hơn như soi gương */
            transform: scaleX(-1); 
        }
        .dashboard {
            position: absolute;
            top: 15px;
            right: 15px; /* Chuyển bảng sang phải vì canvas lật gương */
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            border: 1px solid #555;
            z-index: 10;
        }
        .dashboard p { margin: 5px 0; font-size: 16px; }
        .val { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <h2>AI Nhận Diện Khuôn Mặt (Bản Cải Thiện)</h2>
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
        
        <!-- Bảng điều khiển hiển thị thông số -->
        <div class="dashboard">
            <p>⚡ FPS: <span id="fps" class="val">0</span></p>
            <p>👀 Chớp mắt: <span id="blinks" class="val">0</span></p>
            <p>👄 Miệng: <span id="mouth" class="val">Đóng</span></p>
            <p>👤 Hướng đầu: <span id="head" class="val">Chính diện</span></p>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        // Các thành phần UI
        const fpsEl = document.getElementById('fps');
        const blinksEl = document.getElementById('blinks');
        const mouthEl = document.getElementById('mouth');
        const headEl = document.getElementById('head');

        // Biến trạng thái
        let blinkCount = 0;
        let isBlinking = false;
        let lastTime = 0;
        let lastBlinkTime = 0; // Thời điểm chớp mắt cuối cùng để tính Cooldown

        // Hàm tính khoảng cách giữa 2 điểm
        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function onResults(results) {
            // 1. Tính toán FPS
            const now = performance.now();
            const fps = Math.round(1000 / (now - lastTime));
            lastTime = now;
            fpsEl.innerText = fps;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // 2. Vẽ điểm (Mờ)
                drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#ffffff30', lineWidth: 1});

                // 3. Tô màu các bộ phận
                drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#FF0000', lineWidth: 2});
                drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#FF0000', lineWidth: 2});
                drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#00FF00', lineWidth: 2});
                
                const nosePoints = [1, 2, 4, 195, 197];
                canvasCtx.fillStyle = '#0088FF';
                nosePoints.forEach(idx => {
                    const p = landmarks[idx];
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x * canvasElement.width, p.y * canvasElement.height, 4, 0, 2 * Math.PI);
                    canvasCtx.fill();
                });

                // 4. Đếm số lần chớp mắt (Đã cải thiện)
                const leftEyeH = getDistance(landmarks[159], landmarks[145]);
                const leftEyeW = getDistance(landmarks[33], landmarks[133]);
                const rightEyeH = getDistance(landmarks[386], landmarks[374]);
                const rightEyeW = getDistance(landmarks[362], landmarks[263]);
                
                const avgEAR = ((leftEyeH / leftEyeW) + (rightEyeH / rightEyeW)) / 2;
                const currentTime = new Date().getTime();

                // CẢI THIỆN: Dùng 2 ngưỡng khác nhau và thời gian chờ
                if (avgEAR < 0.20) { // Ngưỡng nhắm (khắt khe hơn)
                    // Cách lần chớp trước ít nhất 250ms mới đếm tiếp
                    if (!isBlinking && (currentTime - lastBlinkTime > 250)) {
                        blinkCount++;
                        blinksEl.innerText = blinkCount;
                        isBlinking = true;
                        lastBlinkTime = currentTime;
                    }
                } else if (avgEAR > 0.24) { 
                    // Ngưỡng mở: Mắt phải mở đủ rộng mới cho phép đếm lần tiếp theo
                    isBlinking = false;
                }

                // 5. Phát hiện mở miệng
                const mouthH = getDistance(landmarks[13], landmarks[14]); 
                const mouthW = getDistance(landmarks[78], landmarks[308]); 
                const mar = mouthH / mouthW;

                if (mar > 0.15) { 
                    mouthEl.innerText = "Đang mở";
                    mouthEl.style.color = "red";
                } else {
                    mouthEl.innerText = "Đóng";
                    mouthEl.style.color = "#00ff00";
                }

                // 6. Theo dõi đầu (Đã sửa lại hướng)
                const nose = landmarks[1];
                const leftCheek = landmarks[234];
                const rightCheek = landmarks[454];

                const distLeft = getDistance(nose, leftCheek);
                const distRight = getDistance(nose, rightCheek);
                const headRatio = distLeft / distRight;

                // CẢI THIỆN: Đảo ngược hướng text và tinh chỉnh hệ số nhạy hơn (1.5 và 0.65)
                if (headRatio > 1.5) {
                    headEl.innerText = "Quay trái 🡨";
                } else if (headRatio < 0.65) {
                    headEl.innerText = "Quay phải ➔";
                } else {
                    headEl.innerText = "Chính diện 👤";
                }

                // Vẽ Text bộ phận (để sau lật gương để không bị ngược chữ)
                canvasCtx.save();
                canvasCtx.translate(canvasElement.width, 0); // Đảo ngược x
                canvasCtx.scale(-1, 1);
                canvasCtx.fillStyle = "yellow";
                canvasCtx.font = "16px Arial";
                
                // Do canvas bị lật nên tọa độ text cũng phải tính lật lại (1 - x)
                canvasCtx.fillText("Mắt", (1 - landmarks[159].x) * canvasElement.width - 15, landmarks[159].y * canvasElement.height - 15);
                canvasCtx.fillText("Mắt", (1 - landmarks[386].x) * canvasElement.width - 15, landmarks[386].y * canvasElement.height - 15);
                canvasCtx.fillText("Mũi", (1 - landmarks[1].x) * canvasElement.width - 10, landmarks[1].y * canvasElement.height - 15);
                canvasCtx.fillText("Miệng", (1 - landmarks[13].x) * canvasElement.width - 20, landmarks[13].y * canvasElement.height - 20);
                canvasCtx.restore();
            }
            canvasCtx.restore();
        }

        // Khởi tạo AI Face Mesh
        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});
        
        faceMesh.setOptions({
            maxNumFaces: 1, 
            refineLandmarks: true, 
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        faceMesh.onResults(onResults);

        // Kích hoạt Webcam
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();

    </script>
</body>
</html>
