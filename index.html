<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Face Tracking</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        
        h2 { 
            margin-top: 5px; 
            font-size: 22px;
            text-align: center;
        }

        .loading {
            color: #0088FF;
            font-style: italic;
            margin-bottom: 10px;
        }

        .container {
            width: 100%;
            max-width: 640px; 
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        video { display: none; }
        
        canvas {
            width: 100%; 
            height: auto; 
            border: 3px solid #444;
            border-radius: 12px;
            background-color: #000;
            transform: scaleX(-1); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .dashboard {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .dashboard div {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        .dashboard p { margin: 0 0 5px 0; font-size: 14px; color: #ccc;}
        .val { display: block; color: #00ff00; font-weight: bold; font-size: 18px; }

        @media (min-width: 768px) {
            .dashboard {
                position: absolute;
                top: 15px;
                right: 15px;
                width: auto;
                display: block; 
                background: rgba(0, 0, 0, 0.7);
                padding: 15px;
                border: 1px solid #555;
            }
            .dashboard div {
                background: transparent;
                padding: 0;
                text-align: left;
                margin-bottom: 8px;
            }
            .dashboard p { display: inline-block; margin: 0; font-size: 16px; color: #fff;}
            .val { display: inline-block; margin-left: 5px; font-size: 16px; }
        }

        /* --- CSS MỚI THÊM CHO CẢNH BÁO --- */
        #warning-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 0, 0, 0.4);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; pointer-events: none;
            animation: flash 0.5s infinite;
        }
        @keyframes flash {
            0% { background: rgba(255, 0, 0, 0.2); }
            50% { background: rgba(255, 0, 0, 0.6); }
            100% { background: rgba(255, 0, 0, 0.2); }
        }
        .warning-text {
            color: white; font-size: 32px; font-weight: bold; text-shadow: 0px 0px 20px #000;
        }
    </style>
</head>
<body> <!-- Đã bỏ onclick="enableAudio()" -->
    
    <!-- HTML MỚI THÊM: Màn hình đỏ cảnh báo -->
    <div id="warning-screen">
        <div id="warning-message" class="warning-text">⚠️ PHÁT HIỆN BUỒN NGỦ ⚠️</div>
    </div>

    <h2>AI Face Tracking phomaiAI</h2>
    <p id="loading-text" class="loading">Đang khởi động Camera & Mô hình AI...</p>
    
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
        
        <div class="dashboard">
            <div><p>⚡ FPS:</p> <span id="fps" class="val">0</span></div>
            <div><p>👀 Chớp mắt:</p> <span id="blinks" class="val">0</span></div>
            <div><p>👄 Miệng:</p> <span id="mouth" class="val">Đóng</span></div>
            <div><p>👤 Hướng:</p> <span id="head" class="val">Chính diện</span></div>
            <!-- MỚI THÊM: Hiển thị trạng thái ngáp và tổng quan -->
            <div><p>🥱 Ngáp:</p> <span id="yawn" class="val" style="color: #ccc;">Không</span></div>
            <div><p>🚨 Trạng thái:</p> <span id="status" class="val">Tỉnh táo</span></div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingText = document.getElementById('loading-text');

        const fpsEl = document.getElementById('fps');
        const blinksEl = document.getElementById('blinks');
        const mouthEl = document.getElementById('mouth');
        const headEl = document.getElementById('head');
        
        // --- JS MỚI THÊM CHO PHẦN TÌM KẾT QUẢ ---
        const yawnEl = document.getElementById('yawn');
        const statusEl = document.getElementById('status');
        const warningScreen = document.getElementById('warning-screen');
        const warningMessage = document.getElementById('warning-message');

        let blinkCount = 0;
        let isBlinking = false;
        let lastTime = 0;
        let lastBlinkTime = 0;

        // Biến để theo dõi thời gian nhắm mắt / há miệng
        let eyeClosedStartTime = 0;
        let mouthOpenStartTime = 0;
        let lastBeepTime = 0;

        // Cài đặt âm thanh (AudioContext)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep() {
            // Tự động đánh thức AudioContext nếu trình duyệt đang khóa
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'square';
            oscillator.frequency.value = 800;
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        function triggerWarning(msg) {
            statusEl.innerText = "CẢNH BÁO";
            statusEl.style.color = "#ff0000";
            warningScreen.style.display = "flex";
            warningMessage.innerText = msg;
            
            const now = performance.now();
            if (now - lastBeepTime > 500) { 
                playBeep();
                lastBeepTime = now;
            }
        }

        function clearWarning() {
            statusEl.innerText = "Tỉnh táo";
            statusEl.style.color = "#00ff00";
            warningScreen.style.display = "none";
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function onResults(results) {
            if(loadingText.style.display !== 'none') {
                loadingText.style.display = 'none'; 
            }

            if (canvasElement.width !== results.image.width || canvasElement.height !== results.image.height) {
                canvasElement.width = results.image.width;
                canvasElement.height = results.image.height;
            }

            const now = performance.now();
            const fps = Math.round(1000 / (now - lastTime));
            lastTime = now;
            fpsEl.innerText = fps;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#ffffff30', lineWidth: 1});
                drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#FF0000', lineWidth: 2});
                drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#FF0000', lineWidth: 2});
                drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#00FF00', lineWidth: 2});
                
                const nosePoints = [1, 2, 4, 195, 197];
                canvasCtx.fillStyle = '#0088FF';
                nosePoints.forEach(idx => {
                    const p = landmarks[idx];
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x * canvasElement.width, p.y * canvasElement.height, 4, 0, 2 * Math.PI);
                    canvasCtx.fill();
                });

                const leftEyeH = getDistance(landmarks[159], landmarks[145]);
                const leftEyeW = getDistance(landmarks[33], landmarks[133]);
                const rightEyeH = getDistance(landmarks[386], landmarks[374]);
                const rightEyeW = getDistance(landmarks[362], landmarks[263]);
                
                const avgEAR = ((leftEyeH / leftEyeW) + (rightEyeH / rightEyeW)) / 2;
                const currentTime = new Date().getTime();

                // --- LOGIC MẮT (CHỚP & NHẮM LÂU) ---
                if (avgEAR < 0.20) { 
                    if (!isBlinking && (currentTime - lastBlinkTime > 250)) {
                        blinkCount++;
                        blinksEl.innerText = blinkCount;
                        isBlinking = true;
                        lastBlinkTime = currentTime;
                    }
                    // Kiểm tra nhắm mắt quá lâu
                    if (eyeClosedStartTime === 0) {
                        eyeClosedStartTime = currentTime;
                    } else if (currentTime - eyeClosedStartTime > 1500) {
                        triggerWarning("⚠️ MẮT ĐANG NHẮM QUÁ LÂU ⚠️");
                    }
                } else if (avgEAR > 0.24) { 
                    isBlinking = false;
                    eyeClosedStartTime = 0; // Đặt lại đồng hồ nhắm mắt
                }

                const mouthH = getDistance(landmarks[13], landmarks[14]); 
                const mouthW = getDistance(landmarks[78], landmarks[308]); 
                const mar = mouthH / mouthW;

                // --- LOGIC MIỆNG (NÓI CHUYỆN & NGÁP) ---
                if (mar > 0.15) { 
                    mouthEl.innerText = "Đang mở";
                    mouthEl.style.color = "#ff4444";
                    
                    // Phát hiện Ngáp (Há miệng rất to và lâu)
                    if (mar > 0.25) {
                        yawnEl.innerText = "Có";
                        yawnEl.style.color = "#ff4444";
                        
                        if (mouthOpenStartTime === 0) {
                            mouthOpenStartTime = currentTime;
                        } else if (currentTime - mouthOpenStartTime > 1500) {
                            triggerWarning("⚠️ BẠN ĐANG NGÁP LIÊN TỤC ⚠️");
                        }
                    } else {
                        yawnEl.innerText = "Không";
                        yawnEl.style.color = "#ccc";
                        mouthOpenStartTime = 0;
                    }
                } else {
                    mouthEl.innerText = "Đóng";
                    mouthEl.style.color = "#00ff00";
                    yawnEl.innerText = "Không";
                    yawnEl.style.color = "#ccc";
                    mouthOpenStartTime = 0;
                }

                // Nếu người dùng bình thường lại thì tắt cảnh báo
                if (avgEAR >= 0.20 && mar <= 0.25) {
                    clearWarning();
                }

                const nose = landmarks[1];
                const leftCheek = landmarks[234];
                const rightCheek = landmarks[454];

                const distLeft = getDistance(nose, leftCheek);
                const distRight = getDistance(nose, rightCheek);
                const headRatio = distLeft / distRight;

                if (headRatio > 1.5) {
                    headEl.innerText = "Trái ←";
                } else if (headRatio < 0.65) {
                    headEl.innerText = "Phải →";
                } else {
                    headEl.innerText = "Chính diện";
                }

                canvasCtx.save();
                canvasCtx.translate(canvasElement.width, 0); 
                canvasCtx.scale(-1, 1);
                canvasCtx.fillStyle = "yellow";
                canvasCtx.font = "bold 16px Arial";
                
                canvasCtx.fillText("Mắt", (1 - landmarks[159].x) * canvasElement.width - 15, landmarks[159].y * canvasElement.height - 15);
                canvasCtx.fillText("Mắt", (1 - landmarks[386].x) * canvasElement.width - 15, landmarks[386].y * canvasElement.height - 15);
                canvasCtx.fillText("Mũi", (1 - landmarks[1].x) * canvasElement.width - 10, landmarks[1].y * canvasElement.height - 15);
                canvasCtx.fillText("Miệng", (1 - landmarks[13].x) * canvasElement.width - 20, landmarks[13].y * canvasElement.height - 20);
                canvasCtx.restore();
            }
            canvasCtx.restore();
        }

        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});
        
        faceMesh.setOptions({
            maxNumFaces: 1, 
            refineLandmarks: true, 
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            facingMode: 'user', 
            width: { ideal: 640 }, 
            height: { ideal: 480 }
        });
        
        camera.start().catch(err => {
            loadingText.innerText = "Vui lòng cấp quyền Camera cho trình duyệt!";
            loadingText.style.color = "red";
        });

    </script>
</body>
</html>
